<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Basket Minutes">
<title>Basket Minutes</title>
<style>
:root{--bg:#0b1220;--panel:#111827;--card:#172033;--line:#334155;--text:#f8fafc;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.app{max-width:1024px;margin:auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px}
h1{font-size:24px;margin:0}
.statusline{color:var(--muted);font-size:13px}
.top{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.box small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.box strong{font-size:28px;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:10px 0}
button{border:0;border-radius:14px;min-height:56px;padding:10px 12px;background:#26364c;color:white;font-weight:800;font-size:16px}
button.primary{background:var(--green);color:#062d18}
button.warn{background:#4b3420;color:#fde68a}
.notice{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;color:var(--muted);margin-bottom:10px}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.player{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px}
.player.on{border-color:var(--green);background:#0e2b20}
.player.pending-out{border-color:var(--yellow);background:#2f2412}
.fields{display:grid;grid-template-columns:70px 1fr;gap:6px}
input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#0f172a;color:white;padding:8px;font-size:16px}
.num{text-align:center;font-weight:900}
.ptime{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;margin:10px 0}
.enter{width:100%;min-height:52px}
.summary{margin-top:10px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px}
.sumrow{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #243244}
.sumrow:last-child{border-bottom:0}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(max-width:720px){.top{grid-template-columns:repeat(2,1fr)}.players{grid-template-columns:repeat(2,1fr)}}
@media(max-width:450px){.players{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions button:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>🏀 Basket Minutes</h1>
      <div class="statusline">12 giocatori · 5 in campo · salvataggio automatico</div>
    </div>
  </div>

  <div class="top">
    <div class="box"><small>TEMPO PARTITA</small><strong id="clock">00:00</strong></div>
    <div class="box"><small>QUARTO</small><strong id="quarter">1°</strong></div>
    <div class="box"><small>IN CAMPO</small><strong id="count">0/5</strong></div>
    <div class="box"><small>STATO</small><strong id="status">PAUSA</strong></div>
  </div>

  <div class="actions">
    <button class="primary" id="start">▶ START</button>
    <button id="nextQ">QUARTO +1</button>
    <button class="warn" id="reset">AZZERA</button>
  </div>

  <div class="notice" id="notice">Inserisci numero e nome, seleziona i 5 titolari e premi START.</div>

  <div id="players" class="players"></div>

  <div class="summary">
    <strong>Minutaggio live</strong>
    <div id="summary"></div>
  </div>
</div>

<script>
(() => {
const KEY="basket-minutes-full-v3";
const defaultPlayers=()=>Array.from({length:12},(_,i)=>({number:String(i+1),name:"Giocatore "+(i+1),seconds:0,on:false}));
let state={players:defaultPlayers(),gameSeconds:0,quarter:1,running:false,lastWall:null,pendingOut:null};

const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const onCount=()=>state.players.filter(p=>p.on).length;

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(x && Array.isArray(x.players) && x.players.length===12){
      state=x;
      if(state.running && state.lastWall){
        const d=Math.max(0,(Date.now()-state.lastWall)/1000);
        state.gameSeconds+=d;
        state.players.forEach(p=>{if(p.on)p.seconds+=d});
        state.lastWall=Date.now();
      }
    }
  }catch(e){}
}
function save(){
  if(state.running) state.lastWall=Date.now();
  localStorage.setItem(KEY,JSON.stringify(state));
}
function sync(){
  if(!state.running) return;
  const now=Date.now();
  const d=Math.max(0,(now-(state.lastWall||now))/1000);
  state.gameSeconds+=d;
  state.players.forEach(p=>{if(p.on)p.seconds+=d});
  state.lastWall=now;
}
function setNotice(t){$("notice").textContent=t}

function startPause(){
  if(state.running){
    sync(); state.running=false; state.lastWall=null; state.pendingOut=null; save();
    setNotice("Cronometro in pausa.");
  }else{
    if(onCount()!==5){setNotice("Servono esattamente 5 giocatori in campo.");return}
    state.running=true; state.lastWall=Date.now(); state.pendingOut=null; save();
    setNotice("Cronometro attivo.");
  }
  render();
}

function tapPlayer(i){
  sync();
  const p=state.players[i];

  if(!state.running){
    if(!p.on && onCount()>=5){setNotice("Hai già 5 giocatori in campo.");return}
    p.on=!p.on;
    state.pendingOut=null;
    save(); render();
    setNotice("#"+p.number+" "+p.name+(p.on?" entra in campo.":" esce dal campo."));
    return;
  }

  if(state.pendingOut===null){
    if(!p.on){setNotice("Durante il gioco, tocca prima il giocatore che deve USCIRE.");return}
    state.pendingOut=i;
    save(); render();
    setNotice("Ora tocca il giocatore che deve ENTRARE.");
    return;
  }

  const out=state.pendingOut;
  if(i===out){
    state.pendingOut=null; save(); render(); setNotice("Cambio annullato.");
    return;
  }
  if(state.players[i].on){setNotice("Scegli un giocatore in panchina.");return}

  state.players[out].on=false;
  state.players[i].on=true;
  state.pendingOut=null;
  save(); render();
  setNotice("Cambio: #"+state.players[out].number+" fuori, #"+state.players[i].number+" dentro.");
}

function render(){
  $("clock").textContent=fmt(state.gameSeconds);
  $("quarter").textContent=state.quarter+"°";
  $("count").textContent=onCount()+"/5";
  $("status").textContent=state.running?"LIVE":"PAUSA";
  $("start").textContent=state.running?"⏸ PAUSA":"▶ START";

  const wrap=$("players"); wrap.innerHTML="";
  state.players.forEach((p,i)=>{
    const c=document.createElement("div");
    c.className="player"+(p.on?" on":"")+(state.pendingOut===i?" pending-out":"");

    const f=document.createElement("div"); f.className="fields";
    const n=document.createElement("input"); n.className="num"; n.inputMode="numeric"; n.value=p.number;
    n.addEventListener("change",()=>{p.number=(n.value||"?").slice(0,3);save();render()});
    const name=document.createElement("input"); name.value=p.name;
    name.addEventListener("change",()=>{p.name=name.value.trim()||("Giocatore "+(i+1));save();render()});
    f.append(n,name);

    const t=document.createElement("div"); t.className="ptime mono"; t.textContent=fmt(p.seconds);
    const b=document.createElement("button"); b.className="enter";
    if(state.running && state.pendingOut===i) b.textContent="ANNULLA USCITA";
    else if(p.on) b.textContent="● ESCE";
    else b.textContent="○ ENTRA";
    b.addEventListener("click",()=>tapPlayer(i));
    c.append(f,t,b); wrap.append(c);
  });

  const sum=$("summary"); sum.innerHTML="";
  state.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.seconds-a.p.seconds).forEach(({p})=>{
    const r=document.createElement("div");r.className="sumrow";
    const l=document.createElement("span");l.textContent="#"+p.number+" "+p.name+(p.on?" ●":"");
    const t=document.createElement("strong");t.className="mono";t.textContent=fmt(p.seconds);
    r.append(l,t);sum.append(r);
  });
}
$("start").addEventListener("click",startPause);
$("nextQ").addEventListener("click",()=>{sync();state.running=false;state.lastWall=null;state.pendingOut=null;state.quarter=state.quarter>=4?1:state.quarter+1;save();render();setNotice("Quarto "+state.quarter+" selezionato.");});
$("reset").addEventListener("click",()=>{if(!confirm("Azzerare tutti i minuti della partita?"))return;const roster=state.players.map(p=>({number:p.number,name:p.name,seconds:0,on:false}));state={players:roster,gameSeconds:0,quarter:1,running:false,lastWall:null,pendingOut:null};save();render();setNotice("Partita azzerata. Nomi e numeri sono rimasti salvati.");});

load();
render();
setInterval(()=>{if(state.running){sync();save();render()}},1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){load();render()}else{sync();save()}});
window.addEventListener("beforeunload",()=>{sync();save()});
})();
</script>
</body>
</html>
