<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Basket Minutes">
<title>Basket Minutes</title>
<style>
:root{
  --bg:#0b1220;--panel:#111827;--card:#172033;--line:#334155;--text:#f8fafc;
  --muted:#94a3b8;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.app{max-width:1100px;margin:auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px}
h1{font-size:24px;margin:0}
.statusline{color:var(--muted);font-size:13px}
.top{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.box small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.box strong{font-size:28px;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin:10px 0}
button{border:0;border-radius:14px;min-height:52px;padding:10px 12px;background:#26364c;color:white;font-weight:800;font-size:15px}
button.primary{background:var(--green);color:#062d18}
button.warn{background:#4b3420;color:#fde68a}
button.report{background:var(--blue)}
button.foul{background:#3b2630;color:#fecaca;min-height:44px}
.notice{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;color:var(--muted);margin-bottom:10px}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.player{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px}
.player.on{border-color:var(--green);background:#0e2b20}
.player.pending-out{border-color:var(--yellow);background:#2f2412}
.fields{display:grid;grid-template-columns:70px 1fr;gap:6px}
input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#0f172a;color:white;padding:8px;font-size:16px}
.num{text-align:center;font-weight:900}
.ptime{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;margin:8px 0 4px}
.qtimes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.qtime{font-size:12px;text-align:center;background:#0f172a;border:1px solid var(--line);border-radius:8px;padding:5px 3px;color:#cbd5e1}
.foulrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-bottom:8px}
.fouls{font-size:14px;font-weight:800}
.enter{width:100%;min-height:50px}
.summary{margin-top:10px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px}
.sumhead,.sumrow{display:grid;grid-template-columns:1.8fr repeat(5,.7fr) .55fr;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #243244}
.sumhead{color:var(--muted);font-size:11px;font-weight:800}
.sumrow:last-child{border-bottom:0}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(max-width:850px){.players{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr 1fr}.sumhead,.sumrow{grid-template-columns:1.7fr repeat(5,.8fr) .5fr}}
@media(max-width:520px){.top{grid-template-columns:repeat(2,1fr)}.players{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions button:first-child{grid-column:1/-1}.summary{overflow-x:auto}.sumhead,.sumrow{min-width:690px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>🏀 Basket Minutes</h1>
      <div class="statusline">12 giocatori · minuti per quarto · falli · report finale · salvataggio automatico</div>
    </div>
  </div>

  <div class="top">
    <div class="box"><small>TEMPO PARTITA</small><strong id="clock">00:00</strong></div>
    <div class="box"><small>QUARTO</small><strong id="quarter">1°</strong></div>
    <div class="box"><small>IN CAMPO</small><strong id="count">0/5</strong></div>
    <div class="box"><small>STATO</small><strong id="status">PAUSA</strong></div>
  </div>

  <div class="actions">
    <button class="primary" id="start">▶ START</button>
    <button id="nextQ">QUARTO +1</button>
    <button class="report" id="report">REPORT</button>
    <button class="warn" id="reset">AZZERA</button>
  </div>

  <div class="notice" id="notice">Inserisci numero e nome, seleziona i 5 titolari e premi START.</div>

  <div id="players" class="players"></div>

  <div class="summary">
    <strong>Minutaggio live</strong>
    <div class="sumhead">
      <span>GIOCATORE</span><span>Q1</span><span>Q2</span><span>Q3</span><span>Q4</span><span>TOT</span><span>F</span>
    </div>
    <div id="summary"></div>
  </div>
</div>

<script>
(() => {
const KEY="basket-minutes-full-v4";
const defaultPlayers=()=>Array.from({length:12},(_,i)=>({
  number:String(i+1),
  name:"Giocatore "+(i+1),
  seconds:0,
  quarters:[0,0,0,0],
  fouls:0,
  on:false
}));

let state={
  players:defaultPlayers(),
  gameSeconds:0,
  quarter:1,
  running:false,
  lastWall:null,
  pendingOut:null
};

const $=id=>document.getElementById(id);
const fmt=s=>{
  s=Math.max(0,Math.floor(s));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")
};
const onCount=()=>state.players.filter(p=>p.on).length;

function normalizeState(x){
  if(!x || !Array.isArray(x.players) || x.players.length!==12) return null;
  x.players=x.players.map((p,i)=>({
    number:String(p.number ?? (i+1)),
    name:p.name || ("Giocatore "+(i+1)),
    seconds:Number(p.seconds)||0,
    quarters:Array.isArray(p.quarters) && p.quarters.length===4 ? p.quarters.map(v=>Number(v)||0) : [0,0,0,0],
    fouls:Number(p.fouls)||0,
    on:!!p.on
  }));
  x.gameSeconds=Number(x.gameSeconds)||0;
  x.quarter=Math.min(4,Math.max(1,Number(x.quarter)||1));
  x.running=!!x.running;
  x.lastWall=x.lastWall||null;
  x.pendingOut=(x.pendingOut===null || x.pendingOut===undefined) ? null : Number(x.pendingOut);
  return x;
}

function load(){
  try{
    let x=JSON.parse(localStorage.getItem(KEY)||"null");
    x=normalizeState(x);
    if(x){
      state=x;
      if(state.running && state.lastWall){
        const d=Math.max(0,(Date.now()-state.lastWall)/1000);
        state.gameSeconds+=d;
        state.players.forEach(p=>{
          if(p.on){
            p.seconds+=d;
            p.quarters[state.quarter-1]+=d;
          }
        });
        state.lastWall=Date.now();
      }
    }
  }catch(e){}
}

function save(){
  if(state.running) state.lastWall=Date.now();
  localStorage.setItem(KEY,JSON.stringify(state));
}

function sync(){
  if(!state.running) return;
  const now=Date.now();
  const d=Math.max(0,(now-(state.lastWall||now))/1000);
  state.gameSeconds+=d;
  state.players.forEach(p=>{
    if(p.on){
      p.seconds+=d;
      p.quarters[state.quarter-1]+=d;
    }
  });
  state.lastWall=now;
}

function setNotice(t){$("notice").textContent=t}

function startPause(){
  if(state.running){
    sync();
    state.running=false;
    state.lastWall=null;
    state.pendingOut=null;
    save();
    setNotice("Cronometro in pausa.");
  }else{
    if(onCount()!==5){
      setNotice("Servono esattamente 5 giocatori in campo.");
      return;
    }
    state.running=true;
    state.lastWall=Date.now();
    state.pendingOut=null;
    save();
    setNotice("Cronometro attivo.");
  }
  render();
}

function tapPlayer(i){
  sync();
  const p=state.players[i];

  if(!state.running){
    if(!p.on && onCount()>=5){
      setNotice("Hai già 5 giocatori in campo.");
      return;
    }
    p.on=!p.on;
    state.pendingOut=null;
    save();
    render();
    setNotice("#"+p.number+" "+p.name+(p.on?" entra in campo.":" esce dal campo."));
    return;
  }

  if(state.pendingOut===null){
    if(!p.on){
      setNotice("Durante il gioco, tocca prima il giocatore che deve USCIRE.");
      return;
    }
    state.pendingOut=i;
    save();
    render();
    setNotice("Ora tocca il giocatore che deve ENTRARE.");
    return;
  }

  const out=state.pendingOut;
  if(i===out){
    state.pendingOut=null;
    save();
    render();
    setNotice("Cambio annullato.");
    return;
  }
  if(state.players[i].on){
    setNotice("Scegli un giocatore in panchina.");
    return;
  }

  state.players[out].on=false;
  state.players[i].on=true;
  state.pendingOut=null;
  save();
  render();
  setNotice("Cambio: #"+state.players[out].number+" fuori, #"+state.players[i].number+" dentro.");
}

function addFoul(i){
  sync();
  const p=state.players[i];
  if(p.fouls>=5){
    setNotice("#"+p.number+" "+p.name+" ha già 5 falli.");
    return;
  }
  p.fouls++;
  save();
  render();
  setNotice("Fallo personale a #"+p.number+" "+p.name+" ("+p.fouls+"/5).");
}

function buildReport(){
  sync();
  const lines=[];
  lines.push("🏀 REPORT PARTITA - BASKET MINUTES");
  lines.push("Tempo registrato: "+fmt(state.gameSeconds));
  lines.push("");
  state.players.forEach(p=>{
    lines.push(
      "#"+p.number+" "+p.name+
      " | Q1 "+fmt(p.quarters[0])+
      " | Q2 "+fmt(p.quarters[1])+
      " | Q3 "+fmt(p.quarters[2])+
      " | Q4 "+fmt(p.quarters[3])+
      " | TOT "+fmt(p.seconds)+
      " | Falli "+p.fouls
    );
  });
  return lines.join("\n");
}

async function shareReport(){
  const text=buildReport();
  save();
  try{
    if(navigator.share){
      await navigator.share({title:"Report Basket Minutes",text});
      setNotice("Report condiviso.");
    }else if(navigator.clipboard){
      await navigator.clipboard.writeText(text);
      setNotice("Report copiato negli appunti.");
    }else{
      prompt("Copia il report:",text);
    }
  }catch(e){
    if(e && e.name==="AbortError") return;
    try{
      await navigator.clipboard.writeText(text);
      setNotice("Report copiato negli appunti.");
    }catch(_){
      prompt("Copia il report:",text);
    }
  }
  render();
}

function render(){
  $("clock").textContent=fmt(state.gameSeconds);
  $("quarter").textContent=state.quarter+"°";
  $("count").textContent=onCount()+"/5";
  $("status").textContent=state.running?"LIVE":"PAUSA";
  $("start").textContent=state.running?"⏸ PAUSA":"▶ START";

  const wrap=$("players");
  wrap.innerHTML="";

  state.players.forEach((p,i)=>{
    const c=document.createElement("div");
    c.className="player"+(p.on?" on":"")+(state.pendingOut===i?" pending-out":"");

    const f=document.createElement("div");
    f.className="fields";

    const n=document.createElement("input");
    n.className="num";
    n.inputMode="numeric";
    n.value=p.number;
    n.addEventListener("change",()=>{
      p.number=(n.value||"?").slice(0,3);
      save();render();
    });

    const name=document.createElement("input");
    name.value=p.name;
    name.addEventListener("change",()=>{
      p.name=name.value.trim()||("Giocatore "+(i+1));
      save();render();
    });

    f.append(n,name);

    const t=document.createElement("div");
    t.className="ptime mono";
    t.textContent=fmt(p.seconds);

    const qs=document.createElement("div");
    qs.className="qtimes";
    p.quarters.forEach((q,qi)=>{
      const qd=document.createElement("div");
      qd.className="qtime mono";
      qd.textContent="Q"+(qi+1)+" "+fmt(q);
      qs.append(qd);
    });

    const fr=document.createElement("div");
    fr.className="foulrow";

    const fl=document.createElement("div");
    fl.className="fouls";
    fl.textContent="Falli: "+p.fouls+"/5";

    const fb=document.createElement("button");
    fb.className="foul";
    fb.textContent="+ FALLO";
    fb.addEventListener("click",(e)=>{
      e.stopPropagation();
      addFoul(i);
    });

    fr.append(fl,fb);

    const b=document.createElement("button");
    b.className="enter";
    if(state.running && state.pendingOut===i) b.textContent="ANNULLA USCITA";
    else if(p.on) b.textContent="● ESCE";
    else b.textContent="○ ENTRA";
    b.addEventListener("click",()=>tapPlayer(i));

    c.append(f,t,qs,fr,b);
    wrap.append(c);
  });

  const sum=$("summary");
  sum.innerHTML="";
  state.players
    .map((p,i)=>({p,i}))
    .sort((a,b)=>b.p.seconds-a.p.seconds)
    .forEach(({p})=>{
      const r=document.createElement("div");
      r.className="sumrow";

      const l=document.createElement("span");
      l.textContent="#"+p.number+" "+p.name+(p.on?" ●":"");

      const vals=[
        fmt(p.quarters[0]),
        fmt(p.quarters[1]),
        fmt(p.quarters[2]),
        fmt(p.quarters[3]),
        fmt(p.seconds),
        String(p.fouls)
      ];

      r.append(l);
      vals.forEach(v=>{
        const s=document.createElement("strong");
        s.className="mono";
        s.textContent=v;
        r.append(s);
      });
      sum.append(r);
    });
}

$("start").addEventListener("click",startPause);

$("nextQ").addEventListener("click",()=>{
  sync();
  state.running=false;
  state.lastWall=null;
  state.pendingOut=null;

  if(state.quarter>=4){
    setNotice("Sei già al 4° quarto.");
  }else{
    state.quarter++;
    setNotice("Quarto "+state.quarter+" selezionato.");
  }

  save();
  render();
});

$("report").addEventListener("click",shareReport);

$("reset").addEventListener("click",()=>{
  if(!confirm("Azzerare minuti, quarti e falli della partita?")) return;

  const roster=state.players.map(p=>({
    number:p.number,
    name:p.name,
    seconds:0,
    quarters:[0,0,0,0],
    fouls:0,
    on:false
  }));

  state={
    players:roster,
    gameSeconds:0,
    quarter:1,
    running:false,
    lastWall:null,
    pendingOut:null
  };

  save();
  render();
  setNotice("Partita azzerata. Nomi e numeri sono rimasti salvati.");
});

load();
render();

setInterval(()=>{
  if(state.running){
    sync();
    save();
    render();
  }
},1000);

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    load();
    render();
  }else{
    sync();
    save();
  }
});

window.addEventListener("beforeunload",()=>{
  sync();
  save();
});
})();
</script>
</body>
</html>
